<div class="friends-layout">
  <header class="topbar">
    <a class="brand" routerLink="/home">
      <img src="logo.png" alt="Chess AI Mate Logo" class="logo-img">
    </a>
  </header>

  <main class="friends">
    <h1 class="pixel-title">Play against Friends</h1>

    <div class="board pixel-box">
      <div class="row" *ngFor="let row of board; let r = index">
        <div
          class="square"
          *ngFor="let cell of row; let c = index"
          [class.dark]="(r + c) % 2 === 1"
          (dragover)="allowDrop($event)"
          (drop)="drop(r, c, $event)"
        >
          <!-- Figur -->
          <span
            *ngIf="cell"
            class="piece"
            [class.white]="isWhite(cell)"
            [class.black]="!isWhite(cell)"
            draggable="true"
            (dragstart)="dragStart(r, c, $event)"
            (click)="onPieceClick(r, c)"
          >
        {{ cell }}
      </span>

          <!-- Pfeil / Highlight, nur wenn kein Piece dort ist -->
          <span
            *ngIf="!cell && arrows[r][c].symbol"
            class="arrow"
            [class.arrow-white]="arrows[r][c].color === 'white'"
            [class.arrow-black]="arrows[r][c].color === 'black'"
          >
            {{ arrows[r][c].symbol }}
          </span>
        </div>
      </div>
    </div>

    <button class="pixel-btn" (click)="resetBoard()">Reset board</button>
  </main>
</div>
