<aside class="chat-container pixel-box">
  <h2 class="chat-title">AI Coach</h2>

  <div class="chat-messages">

    <div *ngFor="let msg of messages" class="message-bubble" [ngClass]="msg.sender">
      <strong>{{ msg.sender === 'coach' ? 'Coach' : 'You' }}:</strong>
      <p>{{ msg.text }}</p>
    </div>

    <div *ngIf="isLoading" class="message-bubble coach typing-indicator">
      <strong>Coach:</strong>
      <p>Thinking...</p>
    </div>

  </div>

  <div class="chat-input-area">
    <input
      type="text"
      class="pixel-input"
      [(ngModel)]="question"
      (keyup.enter)="sendMessage()"
      [disabled]="isLoading"
      placeholder="Ask the coach for advice..."
    >
    <button
      class="pixel-btn"
      (click)="sendMessage()"
      [disabled]="isLoading || !question.trim()">
      Send
    </button>
  </div>
</aside>
