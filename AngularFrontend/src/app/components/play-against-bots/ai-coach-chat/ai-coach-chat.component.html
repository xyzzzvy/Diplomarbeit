<div class="coach-chat pixel-box" aria-label="AI Coach chat">
  <div class="chat-header">
    <h2 class="chat-title">AI Coach</h2>
    <p class="chat-subtitle">Ask about your next move</p>
  </div>

  <div class="chat-messages">
    <div
      class="chat-message"
      *ngFor="let message of messages"
      [class.user]="message.sender === 'user'"
      [class.coach]="message.sender === 'coach'">

      <div class="message-label">
        {{ message.sender === 'user' ? 'You' : 'Coach' }}
      </div>

      <div class="message-bubble">
        {{ message.text }}
      </div>
    </div>
  </div>

  <div class="chat-input-area">
    <textarea
      [(ngModel)]="question"
      class="chat-input"
      rows="4"
      placeholder="Ask the AI Coach about your next move...">
    </textarea>

    <button class="pixel-btn chat-send-btn" type="button" (click)="sendMessage()">
      Send
    </button>
  </div>
</div>
