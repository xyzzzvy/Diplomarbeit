<div class="layout">
  <!-- Sidebar -->
  <aside class="sidenav">
    <img src="logo.png" alt="Chess AI mate Logo" class="logo-img">
    <button class="menu-btn" [routerLink]="['/playAgainstBots']">🤖 Play against bots</button>
    <button class="menu-btn" [routerLink]="['/playAgainstFriends']">👥 Play against friends</button>
    <button class="menu-btn" [routerLink]="['/playAgainstOther']">🌍 Play against other</button>
    <button class="menu-btn" [routerLink]="['/tournaments']">🏆 Tournaments</button>
    <button class="menu-btn" [routerLink]="['/aicoach']">🎓 AI coach</button>

    <!-- ACCESSIBILITY-TOGGLE ganz unten -->
    <button
      class="menu-btn accessibility-toggle"
      type="button"
      (click)="toggleAccessibility()"
      [attr.aria-pressed]="accessibility.isAccessible"
    >
      ♿
      {{ accessibility.isAccessible ? 'Accessible' : 'Normal' }}
    </button>

    <button (click)="changeTheme()">
      🌓 Theme: {{ theme.current }}
    </button>
  </aside>

  <!-- Hauptinhalt -->
  <main class="homepage">
    <div class="pawn">♟</div>
    <h1>Play chess.<br>Improve you chess game.<br>Have fun!</h1>
    <Button class="start-btn" [routerLink]="['/createAccount']">
      ▶ START
    </Button>
  </main>
</div>
