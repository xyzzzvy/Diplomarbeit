<div class="fp-layout">
  <!-- Topbar wie bei Login -->
  <header class="topbar">
    <a class="brand" routerLink="/home">
      <img src="logo.png" alt="Chess AI mate Logo" class="logo-img">
    </a>
  </header>

  <main class="card">
    <h1>Forgot password</h1>

    <!-- Nur E-Mail-Feld -->
    <label class="lbl">E-Mail</label>
    <div class="field">
      <span class="icon">📧</span>
      <input class="input" type="email" placeholder="name@email.com" />
    </div>

    <button class="primary" type="button">Send reset link</button>

    <div class="links">
      <a routerLink="/login" class="link">Back to login</a>
    </div>
  </main>
</div>
